[package]
name = "jdplus-rustcli"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[lib]
name = "jdplus_rustcli"
path = "src/lib.rs"

[[example]]
name = "version"
path = "src/examples/version.rs"

[[example]]
name = "ts_build"
path = "src/examples/ts_build.rs"
